<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>南帝精密報修管理後台</title>
  <style>
    :root{--main:#1f4e79;--bg:#f3f5f7;--border:#d6dee7;--good:#eaf7ea;--bad:#fff0f0;--warn:#fff8e1}
    *{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",Arial,sans-serif;background:var(--bg);color:#222}
    .wrap{max-width:980px;margin:0 auto;padding:24px 16px 60px}.hero{background:var(--main);color:#fff;padding:26px 22px;border-radius:16px;margin-bottom:18px;box-shadow:0 8px 20px #0002}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;line-height:1.7}
    .card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 3px 14px #0001;margin-bottom:18px}.card h2{margin:0 0 14px;color:var(--main);font-size:22px}.hidden{display:none!important}
    label{display:block;font-weight:bold;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:16px;background:#fff}textarea{min-height:90px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{color:#666;font-size:14px;line-height:1.6;margin-top:6px}
    .btn{width:100%;margin-top:16px;border:0;border-radius:12px;padding:13px 18px;color:#fff;background:var(--main);font-size:17px;font-weight:bold;cursor:pointer}.btn.secondary{background:#555}.btn:disabled{opacity:.6;cursor:not-allowed}.inline-btn{width:auto;margin:8px 8px 0 0;padding:9px 13px;font-size:14px;border-radius:9px}.purple{background:#7052a0}.green{background:#3c7d40}.danger{background:#a63c3c}
    .result{display:none;margin-top:14px;padding:12px;border-radius:10px;line-height:1.7;background:#eef6ff}.success{display:block;background:var(--good);border-left:5px solid #3c9d40}.error{display:block;background:var(--bad);border-left:5px solid #d33}.notice{display:block;background:var(--warn);border-left:5px solid #f6b400}
    .toolbar{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}.toolbar>div{flex:1;min-width:220px}.toolbar .actions{display:flex;gap:8px}.toolbar .actions .btn{margin-top:0}.checks{display:flex;gap:10px;flex-wrap:wrap;background:#f7f8fa;border:1px solid var(--border);border-radius:12px;padding:10px}.checks label{display:inline-flex;align-items:center;gap:5px;margin:0;font-weight:normal}.checks input{width:auto}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{border:1px solid var(--border);border-radius:12px;padding:11px;background:#fff}.stat-num{font-size:25px;font-weight:bold;color:var(--main)}
    .repair{border:1px solid var(--border);background:#fff;border-radius:12px;padding:14px;margin-top:12px}.repair.urgent{border-left:5px solid #d33;background:#fff4f4}.repair-id{font-weight:bold;color:var(--main);font-size:18px;margin-bottom:7px}.status{display:inline-block;border-radius:999px;padding:4px 10px;font-weight:bold;background:#eee;margin-bottom:6px}.待處理{background:#fff2cc}.處理中{background:#d9eaf7}.暫緩{background:#eadcf8}.已完成{background:#d9ead3}.row{line-height:1.8;word-break:break-word}.selected{margin-top:14px;background:var(--warn);border-left:5px solid #f6b400;border-radius:10px;padding:12px;line-height:1.7}.quick{margin-top:14px;background:#f7f8fa;border:1px solid var(--border);padding:12px;border-radius:12px}.quick strong{color:var(--main)}
    .photo-modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}.photo-box{background:#fff;border-radius:14px;padding:14px;max-width:92vw;max-height:92vh}.photo-box img{display:block;max-width:85vw;max-height:76vh;margin:auto}.photo-box .btn{margin-top:10px}
    .top-actions{display:flex;justify-content:flex-end;margin-bottom:10px}.logout{width:auto;margin:0;background:#555;padding:9px 14px;font-size:14px}.delete-box{margin-top:14px;border:1px solid #e5b0b0;background:#fff7f7;border-radius:12px;padding:12px}
    a{color:var(--main);font-weight:bold}@media(max-width:700px){.hero h1{font-size:23px}.card{padding:17px}.grid2,.stats-grid{grid-template-columns:1fr}.toolbar .actions{display:block}.toolbar .actions .btn{margin-top:10px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>南帝精密報修管理後台</h1><p>供管理者查看案件、照片、影片連結，安排處理廠商／窗口並更新處理進度。</p></div>
  <section id="loginCard" class="card">
    <h2>管理者登入</h2>
    <label>管理密碼</label><input id="password" type="password" placeholder="請輸入管理密碼" autocomplete="current-password">
    <button id="loginBtn" class="btn" onclick="login()">登入管理後台</button>
    <div id="loginResult" class="result"></div>
  </section>
  <section id="dashboard" class="card hidden">
    <div class="top-actions"><button class="btn logout" onclick="logout()">登出</button></div>
    <h2>案件查詢與處理</h2>
    <div class="toolbar">
      <div><label>案件狀態，可多選</label>
        <div class="checks">
          <label><input type="checkbox" name="filterStatus" value="待處理" checked>待處理</label>
          <label><input type="checkbox" name="filterStatus" value="處理中" checked>處理中</label>
          <label><input type="checkbox" name="filterStatus" value="暫緩">暫緩</label>
          <label><input type="checkbox" name="filterStatus" value="已完成">已完成</label>
          <label><input type="checkbox" id="allStatus" value="全部" onchange="toggleAllStatus()">全部</label>
        </div>
        <div class="hint">預設顯示「待處理＋處理中」，方便看尚未結案案件。</div>
      </div>
      <div class="actions"><button class="btn" onclick="loadCases()">列出案件</button><button class="btn secondary" onclick="loadStats()">查看統計</button></div>
    </div>
    <div id="statsResult" class="result"></div>
    <div id="listResult" class="result"></div>
    <div id="selectedInfo" class="selected hidden"></div>
    <div id="editArea" class="hidden">
      <label>報修編號</label><input id="caseId" type="text" readonly>
      <label>狀態</label><select id="status"><option>待處理</option><option>處理中</option><option>暫緩</option><option>已完成</option></select>
      <div class="quick"><strong>一鍵更新狀態</strong><div class="hint">處理中與已完成需填「處理廠商／窗口」；暫緩與已完成需填備註。</div><button class="btn inline-btn" onclick="quickUpdate('處理中')">改為處理中</button><button class="btn inline-btn purple" onclick="quickUpdate('暫緩')">改為暫緩</button><button class="btn inline-btn green" onclick="quickUpdate('已完成')">改為已完成</button></div>
      <div class="grid2"><div><label>處理廠商／窗口</label><input id="owner" list="vendorOptions" type="text" placeholder="可選擇，也可直接輸入"><datalist id="vendorOptions"><option value="水電廠商"><option value="冷氣廠商"><option value="電梯廠商"><option value="資訊廠商"><option value="內部處理"><option value="其他"></datalist><div class="hint">廠商不多，所以不建立基本檔；特殊情況可直接輸入或寫在備註。</div></div><div><label>預定完成日</label><input id="dueDate" type="date"></div></div>
      <label>備註</label><textarea id="note" placeholder="例如：已通知水電廠商，預計明天下午處理。"></textarea>
      <button id="updateBtn" class="btn secondary" onclick="updateCase()">更新案件</button>
      <div class="delete-box"><strong>測試資料清理</strong><div class="hint">僅用於刪除測試案件。刪除後會同步將此案件照片移至 Google Drive 垃圾桶。</div><button class="btn inline-btn danger" onclick="deleteTestCase()">刪除測試案件</button></div>
      <div id="updateResult" class="result"></div>
    </div>
  </section>
</div>
<div id="photoModal" class="photo-modal hidden"><div class="photo-box"><img id="photoImg" alt="案件照片"><button class="btn secondary" onclick="closePhoto()">關閉照片</button></div></div>
<script>
let token='';let cases=[];
function box(id,msg,type){const b=document.getElementById(id);b.textContent=msg;b.className='result '+type;}
function hide(id){document.getElementById(id).classList.add('hidden')}
function show(id){document.getElementById(id).classList.remove('hidden')}
function escapeHtml(t){return String(t??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:''}
function login(){const pw=document.getElementById('password').value,btn=document.getElementById('loginBtn');if(!pw){box('loginResult','請輸入管理密碼。','error');return}btn.disabled=true;btn.textContent='登入中…';google.script.run.withSuccessHandler(function(res){btn.disabled=false;btn.textContent='登入管理後台';if(!res.success){box('loginResult',res.message,'error');return}token=res.token;hide('loginCard');show('dashboard');loadStats();loadCases();}).withFailureHandler(function(err){btn.disabled=false;btn.textContent='登入管理後台';box('loginResult',err.message||'登入失敗。','error');}).adminLogin(pw)}
function logout(){google.script.run.adminLogout(token);token='';cases=[];hide('dashboard');show('loginCard');document.getElementById('password').value='';box('loginResult','已登出管理後台。','notice')}
function fail(id,err){box(id,err.message||'操作失敗，請重新登入再試。','error')}
function toggleAllStatus(){const all=document.getElementById('allStatus').checked;document.querySelectorAll('input[name="filterStatus"]').forEach(cb=>cb.checked=false);}
function selectedStatuses(){if(document.getElementById('allStatus').checked)return ['全部'];const arr=[...document.querySelectorAll('input[name="filterStatus"]:checked')].map(cb=>cb.value);return arr.length?arr:['待處理','處理中']}
function statusLabel(){const arr=selectedStatuses();return arr.indexOf('全部')>=0?'全部':arr.join('＋')}
function loadStats(){google.script.run.withSuccessHandler(function(res){let html='<strong>案件統計</strong><div class="stats-grid">';['全部','待處理','處理中','暫緩','已完成','逾期','本月新增','平均完成天數'].forEach(function(k){html+='<div class="stat"><div>'+k+'</div><div class="stat-num">'+escapeHtml(res.stats[k]??0)+'</div></div>'});html+='</div>';const b=document.getElementById('statsResult');b.innerHTML=html;b.className='result success';}).withFailureHandler(function(err){fail('statsResult',err)}).adminGetStats(token)}
function loadCases(){const statuses=selectedStatuses();hide('selectedInfo');hide('editArea');box('listResult','案件讀取中…','notice');google.script.run.withSuccessHandler(function(res){cases=res.results||[];if(!cases.length){box('listResult','目前沒有符合條件的案件。','success');return}let html='<strong>'+escapeHtml(statusLabel())+'：'+res.count+' 筆</strong>';cases.forEach(function(item,i){const urgent=item['緊急程度']==='急件'||item['緊急程度']==='停工／危險'?' urgent':'';const video=safeUrl(item['影片連結']);html+='<div class="repair'+urgent+'"><div class="repair-id">'+escapeHtml(item['報修編號'])+'</div><div class="status '+escapeHtml(item['狀態']||'待處理')+'">'+escapeHtml(item['狀態']||'待處理')+'</div><div class="row"><strong>時間：</strong>'+escapeHtml(item['建立時間'])+'</div><div class="row"><strong>報修人：</strong>'+escapeHtml(item['姓名'])+'　'+escapeHtml(item['部門']||'')+'</div><div class="row"><strong>地點：</strong>'+escapeHtml(item['地點'])+'</div><div class="row"><strong>類型／緊急：</strong>'+escapeHtml(item['問題類型'])+'／'+escapeHtml(item['緊急程度']||'一般')+'</div><div class="row"><strong>問題：</strong>'+escapeHtml(item['問題說明'])+'</div>';if(video){html+='<div class="row"><strong>影片：</strong><a href="'+escapeHtml(video)+'" target="_blank" rel="noopener">開啟影片連結</a></div>'}html+='<div class="row"><strong>處理廠商／窗口：</strong>'+escapeHtml(item['負責人']||'-')+'</div><div class="row"><strong>預定完成日：</strong>'+escapeHtml(item['預定完成日']||'-')+'</div><div class="row"><strong>備註：</strong>'+escapeHtml(item['備註']||'-')+'</div>';for(let n=1;n<=Number(item['照片數']||0);n++){html+='<button type="button" class="btn inline-btn" onclick="openPhoto('+i+','+n+')">查看照片 '+n+'</button>'}html+='<button type="button" class="btn inline-btn secondary" onclick="selectCase('+i+')">選擇此案件</button></div>'});const b=document.getElementById('listResult');b.innerHTML=html;b.className='result success';}).withFailureHandler(function(err){fail('listResult',err)}).adminListRepairs(token,statuses)}
function selectCase(index){const item=cases[index];if(!item)return;const oldStatus=item['狀態']||'待處理',nextStatus=oldStatus==='待處理'?'處理中':oldStatus;document.getElementById('caseId').value=item['報修編號']||'';document.getElementById('status').value=nextStatus;document.getElementById('owner').value=item['負責人']||'';document.getElementById('dueDate').value=toDate(item['預定完成日']);document.getElementById('note').value=item['備註']||'';const s=document.getElementById('selectedInfo');s.innerHTML='<strong>已選擇案件：</strong>'+escapeHtml(item['報修編號'])+'<br><strong>地點：</strong>'+escapeHtml(item['地點'])+'<br><strong>問題：</strong>'+escapeHtml(item['問題說明'])+'<br><strong>原狀態：</strong>'+escapeHtml(oldStatus)+'　→　<strong>預備狀態：</strong>'+escapeHtml(nextStatus);show('selectedInfo');show('editArea');document.getElementById('selectedInfo').scrollIntoView({behavior:'smooth',block:'center'})}
function toDate(v){const m=String(v||'').match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);return m?m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'):''}
function quickUpdate(st){if(!document.getElementById('caseId').value){box('updateResult','請先選擇案件。','error');return}document.getElementById('status').value=st;if(st==='已完成'&&!document.getElementById('note').value)document.getElementById('note').value='已完成處理。';updateCase()}
function updateCase(){const payload={caseId:document.getElementById('caseId').value,status:document.getElementById('status').value,owner:document.getElementById('owner').value,dueDate:document.getElementById('dueDate').value,note:document.getElementById('note').value};const btn=document.getElementById('updateBtn');btn.disabled=true;btn.textContent='更新中…';google.script.run.withSuccessHandler(function(res){btn.disabled=false;btn.textContent='更新案件';box('updateResult',res.message||'案件已更新。','success');loadCases();loadStats();}).withFailureHandler(function(err){btn.disabled=false;btn.textContent='更新案件';fail('updateResult',err)}).adminUpdateRepair(token,payload)}
function deleteTestCase(){const caseId=document.getElementById('caseId').value;if(!caseId){box('updateResult','請先選擇要刪除的測試案件。','error');return}const ok=confirm('確定要刪除測試案件 '+caseId+' 嗎？\n此動作會刪除 Google Sheet 該列資料，並將照片移到 Google Drive 垃圾桶。');if(!ok)return;const text=prompt('請輸入「刪除」或 DELETE 以確認刪除測試案件：');if(text===null)return;google.script.run.withSuccessHandler(function(res){box('updateResult',res.message||'測試案件已刪除。','success');hide('selectedInfo');hide('editArea');loadCases();loadStats();}).withFailureHandler(function(err){fail('updateResult',err)}).adminDeleteTestRepair(token,caseId,text)}
function openPhoto(index,number){const item=cases[index];if(!item)return;google.script.run.withSuccessHandler(function(res){if(!res.success){alert(res.message);return}document.getElementById('photoImg').src=res.dataUrl;show('photoModal')}).withFailureHandler(function(err){alert(err.message||'照片讀取失敗')}).adminGetPhoto(token,item['報修編號'],number)}
function closePhoto(){document.getElementById('photoImg').src='';hide('photoModal')}
</script>
</body>
</html>

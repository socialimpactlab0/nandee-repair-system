<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南帝精密內部報修系統</title>
<link rel="stylesheet" href="employee-style.css?v=20260601-1">
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>南帝精密內部報修系統</h1>
    <p>請簡單填寫報修內容，送出後可使用姓名與查詢碼查看進度。<br>如為漏水、用電危險、設備停機等急件，請同時電話通知負責人。</p>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('create')">我要報修</button>
    <button class="tab-btn" onclick="showTab('query')">查詢我的進度</button>
  </div>
  <section id="tab-create" class="card">
    <h2>我要報修</h2>
    <form id="repairForm">
      <label>姓名</label>
      <input type="text" name="name" required placeholder="例如：王小明">
      <label>查詢碼</label>
      <input type="tel" name="queryCode" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="請設定自己容易記得的 4 位數字">
      <div class="hint">查詢進度時需要輸入姓名與這組 4 位數字，請自行記住。</div>
      <div class="grid2">
        <div><label>部門，選填</label><select name="department"><option value="">請選擇</option><option>製課</option><option>品保</option><option>倉庫</option><option>組立</option><option>前面辦公室</option><option>經營層</option><option>其它</option></select></div>
        <div><label>Email，選填</label><input type="email" name="requesterEmail" placeholder="完成後可通知你"></div>
      </div>
      <label>地點</label>
      <input type="text" name="location" required placeholder="例如：一樓洗手台、CNC 區、辦公室">
      <div class="grid2">
        <div><label>問題類型</label><select name="category" required><option value="">請選擇</option><option>水電</option><option>設備</option><option>空調</option><option>資訊</option><option>環境</option><option>其他</option></select></div>
        <div><label>緊急程度</label><select name="urgency"><option>一般</option><option>急件</option><option>停工／危險</option></select></div>
      </div>
      <label>問題說明</label>
      <textarea name="description" required placeholder="請簡單說明問題，例如：洗手台下方會漏水。"></textarea>
      <label>上傳照片，選填</label>
      <div class="hint">每張照片會自動壓縮至約 250KB 以下再上傳，最多 3 張；送出時會一張一張上傳。</div>
      <div class="photo-slot" id="photoSlot0"><div class="photo-slot-title">照片 1</div><input type="file" id="photoFile0" accept="image/*" onchange="handlePhotoChange(0,this)"><div id="photoProgress0" class="upload-progress"></div><div id="photoPreview0" class="photo-preview"><img id="photoPreviewImg0" alt="照片 1 預覽"><button type="button" class="remove-btn" onclick="removePhoto(0)">移除照片</button></div></div>
      <div class="photo-slot hidden" id="photoSlot1"><div class="photo-slot-title">照片 2</div><input type="file" id="photoFile1" accept="image/*" onchange="handlePhotoChange(1,this)"><div id="photoProgress1" class="upload-progress"></div><div id="photoPreview1" class="photo-preview"><img id="photoPreviewImg1" alt="照片 2 預覽"><button type="button" class="remove-btn" onclick="removePhoto(1)">移除照片</button></div></div>
      <div class="photo-slot hidden" id="photoSlot2"><div class="photo-slot-title">照片 3</div><input type="file" id="photoFile2" accept="image/*" onchange="handlePhotoChange(2,this)"><div id="photoProgress2" class="upload-progress"></div><div id="photoPreview2" class="photo-preview"><img id="photoPreviewImg2" alt="照片 3 預覽"><button type="button" class="remove-btn" onclick="removePhoto(2)">移除照片</button></div></div>
      <button id="addPhotoBtn" class="add-photo" type="button" onclick="addPhotoSlot()">＋ 新增一張照片</button>
      <button id="submitRepairBtn" class="btn" type="submit">送出報修</button>
    </form>
    <div id="createResult" class="result"></div>
  </section>
  <section id="tab-query" class="card hidden">
    <h2>查詢我的進度</h2>
    <label>姓名</label><input type="text" id="queryName" placeholder="請輸入報修時填寫的姓名">
    <label>查詢碼</label><input type="tel" id="queryCode" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="請輸入報修時設定的 4 位數字">
    <div class="hint">為保護報修內容，姓名與查詢碼都正確才會顯示案件。</div>
    <button class="btn" onclick="queryRepair()">查詢我的報修</button>
    <div id="queryResult" class="result"></div>
  </section>
  <div class="footer-note">照片會先大幅縮小後逐張上傳；查詢頁不顯示照片連結。</div>
</div>
<script src="employee-app.js?v=20260601-1"></script>
</body>
</html>

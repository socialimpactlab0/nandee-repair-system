<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>南帝精密內部報修系統</title><style>
:root{--main:#1f4e79;--bg:#f3f5f7;--border:#d6dee7;--good:#eaf7ea;--bad:#fff0f0}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",Arial,sans-serif;background:var(--bg);color:#222}.wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}.hero{background:var(--main);color:#fff;padding:28px 22px;border-radius:16px;margin-bottom:18px;box-shadow:0 8px 20px #0002}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;line-height:1.7}.tabs{display:flex;gap:8px;margin-bottom:16px}.tab-btn{flex:1;border:0;padding:13px 16px;border-radius:999px;background:#fff;cursor:pointer;font-size:16px;box-shadow:0 2px 8px #0001}.tab-btn.active{background:var(--main);color:#fff}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 3px 14px #0001;margin-bottom:18px}.card h2{margin:0 0 14px;font-size:22px;color:var(--main)}label{display:block;font-weight:bold;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:16px;background:#fff}textarea{min-height:96px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{color:#666;font-size:14px;line-height:1.6;margin-top:6px}.btn{width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px 18px;color:#fff;background:var(--main);font-size:18px;font-weight:bold;cursor:pointer}.btn.secondary{background:#555}.btn:disabled{opacity:.6;cursor:not-allowed}.result{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.7;background:#eef6ff}.success{background:var(--good)!important;border-left:5px solid #3c9d40}.error{background:var(--bad)!important;border-left:5px solid #d33}.photo-slot{margin-top:12px;padding:12px;border:1px solid var(--border);border-radius:12px;background:#fafbfd}.photo-slot.hidden{display:none}.photo-slot-title{font-weight:bold;color:var(--main);margin-bottom:8px}.upload-progress{display:none;margin-top:8px;padding:9px 10px;border-radius:9px;background:#eef6ff;color:var(--main);font-size:14px;line-height:1.6}.photo-preview{display:none;margin-top:10px}.photo-preview img{display:block;max-width:100%;max-height:220px;border-radius:10px;border:1px solid #ddd}.remove-btn{width:auto;margin-top:8px;padding:8px 12px;border:1px solid #d6dee7;border-radius:8px;background:#fff;color:#555;cursor:pointer}.add-photo{width:auto;padding:10px 14px;margin-top:12px;border:1px dashed var(--main);border-radius:10px;background:#fff;color:var(--main);font-size:15px;font-weight:bold;cursor:pointer}.repair-item{border:1px solid #d9e1ea;border-radius:12px;padding:14px;margin-top:12px;background:#fff}.repair-item.urgent{background:#ffeaea;border-left:5px solid #d33}.repair-id{font-size:18px;font-weight:bold;color:var(--main);margin-bottom:8px}.status{display:inline-block;font-weight:bold;border-radius:999px;padding:4px 10px;margin-bottom:8px;background:#eee}.waiting{background:#fff2cc}.doing{background:#d9eaf7}.done{background:#d9ead3}.hold{background:#eadcf8}.row{line-height:1.8;word-break:break-word}.hidden{display:none}a{color:var(--main);font-weight:bold}.footer-note{color:#666;font-size:14px;line-height:1.7;margin-top:20px}@media(max-width:600px){.hero h1{font-size:24px}.card{padding:18px}.grid2{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="hero"><h1>南帝精密內部報修系統</h1><p>請簡單填寫報修內容，送出後會產生報修編號。<br>如為漏水、用電危險、設備停機等急件，請同時電話通知負責人。</p></div><div class="tabs"><button class="tab-btn active" onclick="showTab('create')">我要報修</button><button class="tab-btn" onclick="showTab('query')">查詢進度</button></div>
<section id="tab-create" class="card"><h2>我要報修</h2><form id="repairForm"><label>姓名</label><input type="text" name="name" required placeholder="例如：王小明"><div class="grid2"><div><label>部門，選填</label><select name="department"><option value="">請選擇</option><option>製課</option><option>品保</option><option>倉庫</option><option>組立</option><option>前面辦公室</option><option>經營層</option><option>其它</option></select></div><div><label>Email，選填</label><input type="email" name="requesterEmail" placeholder="完成後可通知你"></div></div><label>地點</label><input type="text" name="location" required placeholder="例如：一樓洗手台、CNC 區、辦公室"><div class="grid2"><div><label>問題類型</label><select name="category" required><option value="">請選擇</option><option>水電</option><option>設備</option><option>空調</option><option>資訊</option><option>環境</option><option>其他</option></select></div><div><label>緊急程度</label><select name="urgency"><option>一般</option><option>急件</option><option>停工／危險</option></select></div></div><label>問題說明</label><textarea name="description" required placeholder="請簡單說明問題，例如：洗手台下方會漏水。"></textarea><label>上傳照片，選填</label><div class="hint">每張照片會自動縮小後上傳，最多可上傳 3 張。</div>
<div class="photo-slot" id="photoSlot0"><div class="photo-slot-title">照片 1</div><input type="file" id="photoFile0" accept="image/*" onchange="handlePhotoChange(0,this)"><div id="photoProgress0" class="upload-progress"></div><div id="photoPreview0" class="photo-preview"><img id="photoPreviewImg0" alt="照片 1 預覽"><button type="button" class="remove-btn" onclick="removePhoto(0)">移除照片</button></div></div><div class="photo-slot hidden" id="photoSlot1"><div class="photo-slot-title">照片 2</div><input type="file" id="photoFile1" accept="image/*" onchange="handlePhotoChange(1,this)"><div id="photoProgress1" class="upload-progress"></div><div id="photoPreview1" class="photo-preview"><img id="photoPreviewImg1" alt="照片 2 預覽"><button type="button" class="remove-btn" onclick="removePhoto(1)">移除照片</button></div></div><div class="photo-slot hidden" id="photoSlot2"><div class="photo-slot-title">照片 3</div><input type="file" id="photoFile2" accept="image/*" onchange="handlePhotoChange(2,this)"><div id="photoProgress2" class="upload-progress"></div><div id="photoPreview2" class="photo-preview"><img id="photoPreviewImg2" alt="照片 3 預覽"><button type="button" class="remove-btn" onclick="removePhoto(2)">移除照片</button></div></div><button id="addPhotoBtn" class="add-photo" type="button" onclick="addPhotoSlot()">＋ 新增一張照片</button><button id="submitRepairBtn" class="btn" type="submit">送出報修</button></form><div id="createResult" class="result"></div></section>
<section id="tab-query" class="card hidden"><h2>查詢進度</h2><label>報修編號，選填</label><input type="text" id="queryCaseId" placeholder="例如：R20260529"><label>姓名，選填</label><input type="text" id="queryName" placeholder="例如：王小明"><div class="hint">報修編號或姓名，填其中一個即可查詢。</div><button class="btn" onclick="queryRepair()">查詢</button><button class="btn secondary" onclick="loadRecentRepairs()">查看最近 10 筆</button><div id="queryResult" class="result"></div></section><div class="footer-note">照片會先自動縮小後上傳，以減少送出等待時間。</div></div>
<script>
const GAS_WEBAPP_URL='https://script.google.com/macros/s/AKfycbwZGtu0iZI4AavFB39zEygscZorsvTIdnniu2EJqHiKjo76A5WQ3G32F8M7O5M1Nfdqcw/exec';const MAX_ORIGINAL_BYTES=20*1024*1024,MAX_IMAGE_SIDE=1280,JPEG_QUALITY=.72,MAX_PHOTOS=3;let preparedPhotos=[null,null,null],photoTasks=[null,null,null],visiblePhotoSlots=1;
function showTab(tab){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('section[id^="tab-"]').forEach(s=>s.classList.add('hidden'));document.getElementById('tab-'+tab).classList.remove('hidden');document.querySelectorAll('.tab-btn')[tab==='create'?0:1].classList.add('active')}function showResult(id,html,type='success'){const b=document.getElementById(id);b.innerHTML=html;b.className='result '+type;b.style.display='block'}function progress(i,html,type=''){const b=document.getElementById('photoProgress'+i);b.innerHTML=html;b.className='upload-progress '+type;b.style.display='block'}function hideProgress(i){document.getElementById('photoProgress'+i).style.display='none'}function formatBytes(b){return b<1048576?Math.round(b/1024)+' KB':(b/1048576).toFixed(1)+' MB'}function generateCaseId(){const n=new Date(),p=x=>String(x).padStart(2,'0'),r=Math.floor(Math.random()*900+100);return`R${n.getFullYear()}${p(n.getMonth()+1)}${p(n.getDate())}-${p(n.getHours())}${p(n.getMinutes())}${p(n.getSeconds())}${r}`}function formToParams(form){const fd=new FormData(form),p=new URLSearchParams();for(const[k,v]of fd.entries()){if(!(v instanceof File))p.append(k,v)}return p}function readAsDataUrl(blob){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('圖片轉換失敗'));r.readAsDataURL(blob)})}function loadImage(file){return new Promise((ok,no)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);ok(img)};img.onerror=()=>{URL.revokeObjectURL(url);no(new Error('無法讀取圖片格式'))};img.src=url})}function canvasToBlob(c,t,q){return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('圖片壓縮失敗')),t,q))}async function compressPhoto(file){if(file.size>MAX_ORIGINAL_BYTES)throw new Error('照片超過 20MB，請選擇較小的照片。');const img=await loadImage(file),s=Math.min(1,MAX_IMAGE_SIDE/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*s)),h=Math.max(1,Math.round(img.naturalHeight*s)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{alpha:false}).drawImage(img,0,0,w,h);const blob=await canvasToBlob(c,'image/jpeg',JPEG_QUALITY);return{blob,name:'repair-photo-'+Date.now()+'.jpg',type:'image/jpeg',originalSize:file.size}}
function addPhotoSlot(){if(visiblePhotoSlots>=MAX_PHOTOS)return;document.getElementById('photoSlot'+visiblePhotoSlots).classList.remove('hidden');visiblePhotoSlots++;if(visiblePhotoSlots>=MAX_PHOTOS)document.getElementById('addPhotoBtn').style.display='none'}function removePhoto(i){document.getElementById('photoFile'+i).value='';document.getElementById('photoPreview'+i).style.display='none';document.getElementById('photoPreviewImg'+i).src='';hideProgress(i);preparedPhotos[i]=null;photoTasks[i]=null}function handlePhotoChange(i,input){const f=input.files[0],preview=document.getElementById('photoPreview'+i),img=document.getElementById('photoPreviewImg'+i);preparedPhotos[i]=null;preview.style.display='none';img.src='';if(!f){photoTasks[i]=null;hideProgress(i);return}progress(i,'正在縮小照片，請稍候…');photoTasks[i]=compressPhoto(f).then(p=>{preparedPhotos[i]=p;img.src=URL.createObjectURL(p.blob);preview.style.display='block';const saved=Math.max(0,Math.round((1-p.blob.size/p.originalSize)*100));progress(i,`已準備：${formatBytes(p.originalSize)} → <strong>${formatBytes(p.blob.size)}</strong>（縮小 ${saved}%）`,'success');return p}).catch(e=>{preparedPhotos[i]=null;input.value='';progress(i,e.message,'error');return null})}
document.getElementById('repairForm').addEventListener('submit',async function(e){e.preventDefault();const btn=document.getElementById('submitRepairBtn'),id=generateCaseId(),params=formToParams(this);params.append('action','create');params.append('caseId',id);btn.disabled=true;btn.innerText='送出中...';showResult('createResult','正在建立報修資料，請稍候…','success');try{await Promise.all(photoTasks.filter(Boolean));const photos=preparedPhotos.filter(Boolean);if(photos.length){showResult('createResult',`正在上傳 ${photos.length} 張照片，請稍候…`,'success');for(let i=0;i<photos.length;i++){const suffix=i===0?'':String(i+1);params.append('photoData'+suffix,await readAsDataUrl(photos[i].blob));params.append('photoName'+suffix,photos[i].name);params.append('photoType'+suffix,photos[i].type)}}await fetch(GAS_WEBAPP_URL,{method:'POST',mode:'no-cors',body:params});showResult('createResult',`<strong>報修已送出。</strong><br>報修編號：<strong>${id}</strong><br>目前狀態：待處理<br><br>可用姓名或報修編號查詢進度。`,'success');this.reset();preparedPhotos=[null,null,null];photoTasks=[null,null,null];visiblePhotoSlots=1;for(let i=0;i<MAX_PHOTOS;i++){document.getElementById('photoPreview'+i).style.display='none';hideProgress(i);if(i>0)document.getElementById('photoSlot'+i).classList.add('hidden')}document.getElementById('addPhotoBtn').style.display='inline-block'}catch(e){showResult('createResult','送出失敗：'+escapeHtml(e.message||'請稍後再試。'),'error')}finally{btn.disabled=false;btn.innerText='送出報修'}});
function jsonp(url,cb){const n='cb_'+Date.now()+'_'+Math.floor(Math.random()*999),s=document.createElement('script');window[n]=d=>{cb(d);delete window[n];s.remove()};s.src=url+'&callback='+n;s.onerror=()=>showResult('queryResult','讀取失敗，請稍後再試。','error');document.body.appendChild(s)}function queryRepair(){const k=document.getElementById('queryCaseId').value.trim()||document.getElementById('queryName').value.trim();if(!k){showResult('queryResult','請至少輸入報修編號或姓名其中一項。','error');return}jsonp(GAS_WEBAPP_URL+'?action=query&keyword='+encodeURIComponent(k),renderQueryResult)}function loadRecentRepairs(){jsonp(GAS_WEBAPP_URL+'?action=listRecent&limit=10',renderQueryResult)}function photoLinks(it){let a=[];['照片連結','照片連結2','照片連結3'].forEach((k,i)=>{if(it[k])a.push(`<a href="${escapeHtml(it[k])}" target="_blank" rel="noopener">查看照片 ${i+1}</a>`)});return a.length?`<div class="row"><strong>照片：</strong>${a.join('　')}</div>`:''}function renderQueryResult(d){if(!d.success){showResult('queryResult',d.message||'查詢失敗。','error');return}if(!d.results||!d.results.length){showResult('queryResult','查無資料。','error');return}let h=`<strong>共找到 ${d.count} 筆資料</strong>`;d.results.forEach(it=>{const u=it['緊急程度']==='急件'||it['緊急程度']==='停工／危險'?' urgent':'';h+=`<div class="repair-item${u}"><div class="repair-id">${escapeHtml(it['報修編號'])}</div><div class="status ${statusClass(it['狀態'])}">${escapeHtml(it['狀態']||'待處理')}</div><div class="row"><strong>日期：</strong>${escapeHtml(it['建立時間'])}</div><div class="row"><strong>地點：</strong>${escapeHtml(it['地點'])}</div><div class="row"><strong>問題：</strong>${escapeHtml(it['問題說明'])}</div>${photoLinks(it)}<div class="row"><strong>預定完成日：</strong>${escapeHtml(it['預定完成日']||'-')}</div><div class="row"><strong>備註：</strong>${escapeHtml(it['備註']||'-')}</div></div>`});showResult('queryResult',h,'success')}function statusClass(s){return s==='待處理'?'waiting':s==='處理中'?'doing':s==='已完成'?'done':s==='暫緩'?'hold':''}function escapeHtml(t){return String(t??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
</script></body></html>

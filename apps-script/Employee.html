<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>南帝精密內部報修系統</title>
  <style>
    :root{--main:#1f4e79;--bg:#f3f5f7;--border:#d6dee7;--good:#eaf7ea;--bad:#fff0f0;--notice:#fff8e1}
    *{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",Arial,sans-serif;background:var(--bg);color:#222}.wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}.hero{background:var(--main);color:#fff;padding:28px 22px;border-radius:16px;margin-bottom:18px;box-shadow:0 8px 20px #0002}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;line-height:1.7}.tabs{display:flex;gap:8px;margin-bottom:16px}.tab-btn{flex:1;border:0;padding:13px 16px;border-radius:999px;background:#fff;cursor:pointer;font-size:16px;box-shadow:0 2px 8px #0001}.tab-btn.active{background:var(--main);color:#fff}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 3px 14px #0001;margin-bottom:18px}.card h2{margin:0 0 14px;font-size:22px;color:var(--main)}label{display:block;font-weight:bold;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:16px;background:#fff}textarea{min-height:96px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{color:#666;font-size:14px;line-height:1.6;margin-top:6px}.btn{width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px 18px;color:#fff;background:var(--main);font-size:18px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.6;cursor:not-allowed}.result{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.7}.success{display:block;background:var(--good);border-left:5px solid #3c9d40}.error{display:block;background:var(--bad);border-left:5px solid #d33}.notice{display:block;background:var(--notice);border-left:5px solid #f6b400}.photo-slot{margin-top:12px;padding:12px;border:1px solid var(--border);border-radius:12px;background:#fafbfd}.photo-slot-title{font-weight:bold;color:var(--main);margin-bottom:8px}.photo-slot.hidden{display:none}.upload-progress{display:none;margin-top:8px;padding:9px 10px;border-radius:9px;background:#eef6ff;color:var(--main);font-size:14px;line-height:1.6}.photo-preview{display:none;margin-top:10px}.photo-preview img{display:block;max-width:100%;max-height:220px;border-radius:10px;border:1px solid #ddd}.remove-btn{width:auto;margin-top:8px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;color:#555;cursor:pointer}.add-photo{width:auto;padding:10px 14px;margin-top:12px;border:1px dashed var(--main);border-radius:10px;background:#fff;color:var(--main);font-size:15px;font-weight:bold;cursor:pointer}.repair-item{border:1px solid #d9e1ea;border-radius:12px;padding:14px;margin-top:12px;background:#fff}.repair-id{font-size:18px;font-weight:bold;color:var(--main);margin-bottom:8px}.status{display:inline-block;font-weight:bold;border-radius:999px;padding:4px 10px;margin-bottom:8px;background:#eee}.waiting{background:#fff2cc}.doing{background:#d9eaf7}.done{background:#d9ead3}.hold{background:#eadcf8}.row{line-height:1.8;word-break:break-word}.hidden{display:none}.footer-note{color:#666;font-size:14px;line-height:1.7;margin-top:20px}.timing{color:#666;font-size:13px;margin-top:9px}@media(max-width:600px){.hero h1{font-size:24px}.card{padding:18px}.grid2{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>南帝精密內部報修系統</h1><p>請簡單填寫報修內容，送出後可使用姓名與查詢碼查看進度。<br>如為漏水、用電危險、設備停機等急件，請同時電話通知負責人。</p></div>
  <div class="tabs"><button class="tab-btn active" onclick="showTab('create')">我要報修</button><button class="tab-btn" onclick="showTab('query')">查詢我的進度</button></div>
  <section id="tab-create" class="card"><h2>我要報修</h2>
    <form id="repairForm">
      <label>姓名</label><input type="text" name="name" required placeholder="例如：王小明">
      <label>查詢碼</label><input type="tel" name="queryCode" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="請設定自己容易記得的 4 位數字">
      <div class="hint">查詢進度時需要輸入姓名與這組 4 位數字，請自行記住。</div>
      <div class="grid2">
        <div><label>部門，選填</label><select name="department"><option value="">請選擇</option><option>製課</option><option>品保</option><option>倉庫</option><option>組立</option><option>前面辦公室</option><option>經營層</option><option>其它</option></select></div>
        <div><label>Email，選填</label><input type="email" name="requesterEmail" placeholder="完成後可通知你"></div>
      </div>
      <label>地點</label><input type="text" name="location" required placeholder="例如：一樓洗手台、CNC 區、辦公室">
      <div class="grid2">
        <div><label>問題類型</label><select name="category" required><option value="">請選擇</option><option>水電</option><option>設備</option><option>空調</option><option>資訊</option><option>環境</option><option>其他</option></select></div>
        <div><label>緊急程度</label><select name="urgency"><option>一般</option><option>急件</option><option>停工／危險</option></select></div>
      </div>
      <label>問題說明</label><textarea name="description" required placeholder="請簡單說明問題，例如：洗手台下方會漏水。"></textarea>
      <label>上傳照片，選填</label><div class="hint">最多 3 張；每張會自動壓縮至約 250KB 以下後送出。</div>
      <div class="photo-slot" id="photoSlot0"><div class="photo-slot-title">照片 1</div><input type="file" id="photoFile0" accept="image/*" onchange="handlePhotoChange(0,this)"><div id="photoProgress0" class="upload-progress"></div><div id="photoPreview0" class="photo-preview"><img id="photoPreviewImg0" alt="照片 1 預覽"><button type="button" class="remove-btn" onclick="removePhoto(0)">移除照片</button></div></div>
      <div class="photo-slot hidden" id="photoSlot1"><div class="photo-slot-title">照片 2</div><input type="file" id="photoFile1" accept="image/*" onchange="handlePhotoChange(1,this)"><div id="photoProgress1" class="upload-progress"></div><div id="photoPreview1" class="photo-preview"><img id="photoPreviewImg1" alt="照片 2 預覽"><button type="button" class="remove-btn" onclick="removePhoto(1)">移除照片</button></div></div>
      <div class="photo-slot hidden" id="photoSlot2"><div class="photo-slot-title">照片 3</div><input type="file" id="photoFile2" accept="image/*" onchange="handlePhotoChange(2,this)"><div id="photoProgress2" class="upload-progress"></div><div id="photoPreview2" class="photo-preview"><img id="photoPreviewImg2" alt="照片 3 預覽"><button type="button" class="remove-btn" onclick="removePhoto(2)">移除照片</button></div></div>
      <button id="addPhotoBtn" class="add-photo" type="button" onclick="addPhotoSlot()">＋ 新增一張照片</button>
      <button id="submitRepairBtn" class="btn" type="submit">送出報修</button>
    </form>
    <div id="createResult" class="result"></div>
  </section>
  <section id="tab-query" class="card hidden"><h2>查詢我的進度</h2>
    <label>姓名</label><input type="text" id="queryName" placeholder="請輸入報修時填寫的姓名">
    <label>查詢碼</label><input type="tel" id="queryCode" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="請輸入報修時設定的 4 位數字">
    <div class="hint">姓名與查詢碼都正確才會顯示案件。</div>
    <button class="btn" onclick="queryRepair()">查詢我的報修</button>
    <div id="queryResult" class="result"></div>
  </section>
  <div class="footer-note">照片為管理者查看使用，員工查詢頁不顯示照片連結。</div>
</div>
<script>
const MAX_ORIGINAL_BYTES=20*1024*1024,MAX_IMAGE_SIDE=960,MIN_IMAGE_SIDE=600,JPEG_QUALITY=.60,MIN_JPEG_QUALITY=.36,TARGET_IMAGE_BYTES=250*1024,MAX_PHOTOS=3;
let preparedPhotos=[null,null,null],photoTasks=[null,null,null],visiblePhotoSlots=1;
function showTab(tab){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('section[id^="tab-"]').forEach(s=>s.classList.add('hidden'));document.getElementById('tab-'+tab).classList.remove('hidden');document.querySelectorAll('.tab-btn')[tab==='create'?0:1].classList.add('active')}
function result(id,html,type){const box=document.getElementById(id);box.innerHTML=html;box.className='result '+type}
function progress(i,html,type){const box=document.getElementById('photoProgress'+i);box.innerHTML=html;box.className='upload-progress '+(type||'');box.style.display='block'}
function hideProgress(i){document.getElementById('photoProgress'+i).style.display='none'}
function escapeHtml(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function formatBytes(b){return b<1048576?Math.round(b/1024)+' KB':(b/1048576).toFixed(1)+' MB'}
function loadImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('無法讀取圖片格式'))};img.src=url})}
function canvasToDataUrl(canvas,quality){return canvas.toDataURL('image/jpeg',quality)}
async function compressPhoto(file){if(file.size>MAX_ORIGINAL_BYTES)throw new Error('照片超過 20MB，請選擇較小照片。');const img=await loadImage(file);let side=MAX_IMAGE_SIDE,quality=JPEG_QUALITY,dataUrl='';while(true){const scale=Math.min(1,side/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d',{alpha:false}).drawImage(img,0,0,canvas.width,canvas.height);dataUrl=canvasToDataUrl(canvas,quality);const bytes=Math.round((dataUrl.length-dataUrl.indexOf(',')-1)*0.75);if(bytes<=TARGET_IMAGE_BYTES||(quality<=MIN_JPEG_QUALITY&&side<=MIN_IMAGE_SIDE))return{dataUrl,name:'repair-photo-'+Date.now()+'.jpg',type:'image/jpeg',originalSize:file.size,size:bytes};if(quality>MIN_JPEG_QUALITY){quality=Math.max(MIN_JPEG_QUALITY,quality-.08)}else{side=Math.max(MIN_IMAGE_SIDE,Math.round(side*.82))}}}
function addPhotoSlot(){if(visiblePhotoSlots>=MAX_PHOTOS)return;document.getElementById('photoSlot'+visiblePhotoSlots).classList.remove('hidden');visiblePhotoSlots++;if(visiblePhotoSlots>=MAX_PHOTOS)document.getElementById('addPhotoBtn').style.display='none'}
function removePhoto(i){document.getElementById('photoFile'+i).value='';document.getElementById('photoPreview'+i).style.display='none';document.getElementById('photoPreviewImg'+i).src='';hideProgress(i);preparedPhotos[i]=null;photoTasks[i]=null}
function handlePhotoChange(i,input){const file=input.files[0];if(!file){removePhoto(i);return}progress(i,'正在壓縮照片…','notice');photoTasks[i]=compressPhoto(file).then(photo=>{preparedPhotos[i]=photo;document.getElementById('photoPreviewImg'+i).src=photo.dataUrl;document.getElementById('photoPreview'+i).style.display='block';progress(i,'已準備：'+formatBytes(photo.originalSize)+' → <strong>'+formatBytes(photo.size)+'</strong>','success')}).catch(error=>{preparedPhotos[i]=null;input.value='';progress(i,escapeHtml(error.message),'error')})}
function resetForm(){document.getElementById('repairForm').reset();preparedPhotos=[null,null,null];photoTasks=[null,null,null];visiblePhotoSlots=1;for(let i=0;i<MAX_PHOTOS;i++){document.getElementById('photoPreview'+i).style.display='none';document.getElementById('photoPreviewImg'+i).src='';hideProgress(i);if(i>0)document.getElementById('photoSlot'+i).classList.add('hidden')}document.getElementById('addPhotoBtn').style.display='inline-block'}
document.getElementById('repairForm').addEventListener('submit',async function(event){event.preventDefault();const btn=document.getElementById('submitRepairBtn');btn.disabled=true;btn.textContent='送出中…';result('createResult','正在建立報修資料，請稍候…','notice');try{await Promise.all(photoTasks.filter(Boolean));const fd=new FormData(this);const payload={name:fd.get('name'),queryCode:fd.get('queryCode'),department:fd.get('department'),requesterEmail:fd.get('requesterEmail'),location:fd.get('location'),category:fd.get('category'),urgency:fd.get('urgency'),description:fd.get('description'),photos:preparedPhotos.filter(Boolean).map(p=>({dataUrl:p.dataUrl,name:p.name,type:p.type}))};google.script.run.withSuccessHandler(function(response){const fail=response.failedPhotos||[],time=(response.timing.totalMs/1000).toFixed(1);let msg='<strong>報修已成功建立。</strong><br>報修編號：<strong>'+escapeHtml(response.caseId)+'</strong><br>已收到照片：'+response.photoCount+' 張';if(fail.length)msg+='<br>第 '+fail.join('、')+' 張照片未上傳成功，請通知管理者補確認。';msg+='<div class="timing">此次送出約 '+time+' 秒（供測試速度使用）</div>';result('createResult',msg,fail.length?'notice':'success');resetForm();btn.disabled=false;btn.textContent='送出報修'}).withFailureHandler(function(error){result('createResult','送出失敗：'+escapeHtml(error.message||'請稍後再試。'),'error');btn.disabled=false;btn.textContent='送出報修'}).employeeSubmitRepair(payload)}catch(error){result('createResult','送出失敗：'+escapeHtml(error.message),'error');btn.disabled=false;btn.textContent='送出報修'}});
function queryRepair(){const name=document.getElementById('queryName').value.trim(),code=document.getElementById('queryCode').value.trim();if(!name||!/^\d{4}$/.test(code)){result('queryResult','請輸入姓名與 4 位數字查詢碼。','error');return}result('queryResult','查詢中…','notice');google.script.run.withSuccessHandler(renderQuery).withFailureHandler(error=>result('queryResult','查詢失敗：'+escapeHtml(error.message),'error')).employeeQueryRepairs(name,code)}
function renderQuery(data){if(!data.results||!data.results.length){result('queryResult','查無符合的報修資料。','error');return}let html='<strong>找到您的 '+data.count+' 筆報修資料</strong>';data.results.forEach(item=>{html+='<div class="repair-item"><div class="repair-id">'+escapeHtml(item['報修編號'])+'</div><div class="status '+statusClass(item['狀態'])+'">'+escapeHtml(item['狀態']||'待處理')+'</div><div class="row"><strong>日期：</strong>'+escapeHtml(item['建立時間'])+'</div><div class="row"><strong>地點：</strong>'+escapeHtml(item['地點'])+'</div><div class="row"><strong>問題：</strong>'+escapeHtml(item['問題說明'])+'</div><div class="row"><strong>預定完成日：</strong>'+escapeHtml(item['預定完成日']||'-')+'</div><div class="row"><strong>備註：</strong>'+escapeHtml(item['備註']||'-')+'</div></div>'});result('queryResult',html,'success')}
function statusClass(s){return s==='待處理'?'waiting':s==='處理中'?'doing':s==='已完成'?'done':s==='暫緩'?'hold':''}
</script>
</body>
</html>

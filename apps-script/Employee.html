<!DOCTYPE html>
<html lang="zh-Hant">
<head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>南帝精密內部報修系統</title>
<style>
:root{--c:#1f4e79;--bg:#f3f5f7;--bd:#d6dee7;--ok:#eaf7ea;--er:#fff0f0;--nt:#fff8e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Microsoft JhengHei",Arial;color:#222}.wrap{max-width:760px;margin:auto;padding:22px 15px 50px}.hero{background:var(--c);color:#fff;border-radius:16px;padding:25px 21px;margin-bottom:16px}.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0;line-height:1.65}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{flex:1;border:0;border-radius:25px;background:#fff;padding:13px;font-size:16px}.tabs .on{background:var(--c);color:#fff}.card{background:#fff;padding:21px;border-radius:16px;margin-bottom:18px;box-shadow:0 3px 12px #0001}.card h2{margin:0 0 12px;color:var(--c)}label{display:block;font-weight:bold;margin:13px 0 6px}input,select,textarea{width:100%;font-size:16px;border:1px solid var(--bd);border-radius:10px;padding:11px;background:#fff}textarea{min-height:92px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{font-size:14px;color:#666;line-height:1.55;margin-top:6px}.photo{border:1px solid var(--bd);background:#fafbfd;border-radius:11px;padding:11px;margin-top:10px}.photo b{display:block;color:var(--c);margin-bottom:7px}.photo img{display:none;max-width:100%;max-height:180px;margin-top:9px;border-radius:8px}.btn{width:100%;background:var(--c);border:0;color:#fff;border-radius:11px;padding:14px;margin-top:16px;font-size:18px;font-weight:bold}.btn:disabled{opacity:.6}.out{display:none;padding:13px;margin-top:14px;border-radius:10px;line-height:1.7}.ok{display:block;background:var(--ok);border-left:5px solid #39953b}.err{display:block;background:var(--er);border-left:5px solid #d33}.note{display:block;background:var(--nt);border-left:5px solid #e4a800}.hide{display:none}.case{border:1px solid var(--bd);border-radius:11px;padding:12px;margin-top:10px}.caseid{font-size:18px;color:var(--c);font-weight:bold}.tag{display:inline-block;background:#fff2cc;padding:4px 10px;border-radius:20px;font-weight:bold;margin:7px 0}.row{line-height:1.8}.foot{font-size:14px;color:#666;line-height:1.7}@media(max-width:600px){.two{grid-template-columns:1fr}.hero h1{font-size:23px}.card{padding:17px}}
</style></head>
<body><div class="wrap">
<div class="hero"><h1>南帝精密內部報修系統</h1><p>請簡單填寫報修內容。漏水、用電危險、設備停機等急件，請同時電話通知負責人。</p></div>
<div class="tabs"><button id="bc" class="on" onclick="tab('create')">我要報修</button><button id="bq" onclick="tab('query')">查詢我的進度</button></div>
<section class="card" id="create"><h2>我要報修</h2><form id="form">
<label>姓名</label><input name="name" required placeholder="例如：王小明">
<label>查詢碼</label><input name="queryCode" required inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="請設定容易記得的 4 位數字"><div class="hint">日後查詢進度需要輸入姓名與這組查詢碼。</div>
<div class="two"><div><label>部門，選填</label><select name="department"><option value="">請選擇</option><option>製課</option><option>品保</option><option>倉庫</option><option>組立</option><option>前面辦公室</option><option>經營層</option><option>其它</option></select></div><div><label>Email，選填</label><input name="requesterEmail" type="email" placeholder="完成後可通知你"></div></div>
<label>地點</label><input name="location" required placeholder="例如：一樓洗手台、CNC 區">
<div class="two"><div><label>問題類型</label><select name="category" required><option value="">請選擇</option><option>水電</option><option>設備</option><option>空調</option><option>資訊</option><option>環境</option><option>其他</option></select></div><div><label>緊急程度</label><select name="urgency"><option>一般</option><option>急件</option><option>停工／危險</option></select></div></div>
<label>問題說明</label><textarea name="description" required placeholder="例如：洗手台下方持續漏水。"></textarea>
<label>照片，選填</label><div class="hint">最多 3 張。如選 2～3 張，送出時會自動合併為一張圖片，減少上傳等待時間。</div>
<div class="photo"><b>照片 1</b><input id="f0" type="file" accept="image/*" onchange="preview(0)"><img id="p0"></div>
<div class="photo"><b>照片 2</b><input id="f1" type="file" accept="image/*" onchange="preview(1)"><img id="p1"></div>
<div class="photo"><b>照片 3</b><input id="f2" type="file" accept="image/*" onchange="preview(2)"><img id="p2"></div>
<button class="btn" id="submit" type="submit">送出報修</button></form><div id="createOut" class="out"></div></section>
<section class="card hide" id="query"><h2>查詢我的進度</h2><label>姓名</label><input id="qn" placeholder="請輸入報修時的姓名"><label>查詢碼</label><input id="qc" inputmode="numeric" maxlength="4" placeholder="請輸入 4 位數字"><button class="btn" onclick="searchCase()">查詢我的報修</button><div id="queryOut" class="out"></div></section>
<div class="foot">照片只提供管理者查看，員工查詢頁不顯示照片連結。</div></div>
<script>
const MAX_ORIGINAL=20*1024*1024,TARGET_ONE=250*1024,TARGET_MERGED=330*1024,MAX_W=900,MIN_W=580;
function tab(t){document.getElementById('create').classList.toggle('hide',t!=='create');document.getElementById('query').classList.toggle('hide',t!=='query');document.getElementById('bc').classList.toggle('on',t==='create');document.getElementById('bq').classList.toggle('on',t==='query')}
function out(id,msg,cls){const x=document.getElementById(id);x.innerHTML=msg;x.className='out '+cls}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function preview(i){const f=document.getElementById('f'+i).files[0],img=document.getElementById('p'+i);if(!f){img.style.display='none';return}img.src=URL.createObjectURL(f);img.style.display='block'}
function load(file){return new Promise((ok,no)=>{if(file.size>MAX_ORIGINAL){no(new Error('照片超過 20MB，請更換照片。'));return}const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);ok(im)};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('無法讀取照片。'))};im.src=u})}
function size(data){return Math.round((data.length-data.indexOf(',')-1)*.75)}
function fit(img,w,maxH){let r=Math.min(1,w/img.naturalWidth,maxH/img.naturalHeight);return{w:Math.round(img.naturalWidth*r),h:Math.round(img.naturalHeight*r)}}
function encode(canvas,target){let q=.7,data=canvas.toDataURL('image/jpeg',q);while(size(data)>target&&q>.38){q-=.08;data=canvas.toDataURL('image/jpeg',q)}return data}
async function makePhoto(files){
 const imgs=await Promise.all(files.map(load));
 if(imgs.length===1){let d=drawSingle(imgs[0],900);let data=encode(d,TARGET_ONE);if(size(data)>TARGET_ONE){d=drawSingle(imgs[0],700);data=encode(d,TARGET_ONE)}return{dataUrl:data,name:'repair-photo.jpg',type:'image/jpeg'};}
 let width=MAX_W,data='';
 while(width>=MIN_W){const c=drawMerged(imgs,width);data=encode(c,TARGET_MERGED);if(size(data)<=345*1024)break;width=Math.round(width*.84)}
 if(size(data)>345*1024)throw new Error('合併後照片仍過大，請減少照片張數。');
 return{dataUrl:data,name:'repair-merged.jpg',type:'image/jpeg'};
}
function drawSingle(img,w){const d=fit(img,w,1100),c=document.createElement('canvas');c.width=d.w;c.height=d.h;c.getContext('2d').drawImage(img,0,0,d.w,d.h);return c}
function drawMerged(imgs,w){let parts=imgs.map(im=>fit(im,w,660)),h=parts.reduce((s,p)=>s+p.h+32,0)+10*(imgs.length-1),c=document.createElement('canvas'),ctx;c.width=w;c.height=h;ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);let y=0;imgs.forEach((im,i)=>{ctx.fillStyle='#eef3f7';ctx.fillRect(0,y,w,32);ctx.fillStyle='#1f4e79';ctx.font='bold 17px Arial';ctx.fillText('Photo '+(i+1),12,y+22);y+=32;let p=parts[i],x=Math.round((w-p.w)/2);ctx.drawImage(im,x,y,p.w,p.h);y+=p.h+10});return c}
document.getElementById('form').addEventListener('submit',async function(e){e.preventDefault();const btn=document.getElementById('submit'),start=Date.now(),fd=new FormData(this),files=[0,1,2].map(i=>document.getElementById('f'+i).files[0]).filter(Boolean);btn.disabled=true;btn.textContent='送出中…';try{let photos=[];if(files.length){out('createOut',files.length>1?'正在合併照片並送出，請稍候…':'正在處理照片並送出，請稍候…','note');photos=[await makePhoto(files)]}else out('createOut','正在建立報修資料，請稍候…','note');const payload={name:fd.get('name'),queryCode:fd.get('queryCode'),department:fd.get('department'),requesterEmail:fd.get('requesterEmail'),location:fd.get('location'),category:fd.get('category'),urgency:fd.get('urgency'),description:fd.get('description'),photos};google.script.run.withSuccessHandler(res=>{const sec=((Date.now()-start)/1000).toFixed(1),photoText=files.length>1?'已收到 '+files.length+' 張照片（合併為一張上傳）':'已收到照片：'+res.photoCount+' 張';out('createOut','<strong>報修已成功建立。</strong><br>報修編號：<strong>'+esc(res.caseId)+'</strong><br>'+photoText+'<br><span class="hint">此次送出約 '+sec+' 秒</span>','ok');document.getElementById('form').reset();[0,1,2].forEach(i=>document.getElementById('p'+i).style.display='none');btn.disabled=false;btn.textContent='送出報修'}).withFailureHandler(err=>{out('createOut','送出失敗：'+esc(err.message||'請稍後再試。'),'err');btn.disabled=false;btn.textContent='送出報修'}).employeeSubmitRepair(payload)}catch(err){out('createOut','送出失敗：'+esc(err.message),'err');btn.disabled=false;btn.textContent='送出報修'}});
function searchCase(){const n=document.getElementById('qn').value.trim(),c=document.getElementById('qc').value.trim();if(!n||!/^\d{4}$/.test(c)){out('queryOut','請輸入姓名與 4 位數字查詢碼。','err');return}out('queryOut','查詢中…','note');google.script.run.withSuccessHandler(render).withFailureHandler(e=>out('queryOut','查詢失敗：'+esc(e.message),'err')).employeeQueryRepairs(n,c)}
function render(data){if(!data.results.length){out('queryOut','查無符合的報修資料。','err');return}let h='<strong>找到您的 '+data.count+' 筆報修資料</strong>';data.results.forEach(x=>{h+='<div class="case"><div class="caseid">'+esc(x['報修編號'])+'</div><div class="tag">'+esc(x['狀態']||'待處理')+'</div><div class="row">日期：'+esc(x['建立時間'])+'<br>地點：'+esc(x['地點'])+'<br>問題：'+esc(x['問題說明'])+'<br>預定完成日：'+esc(x['預定完成日']||'-')+'<br>備註：'+esc(x['備註']||'-')+'</div></div>'});out('queryOut',h,'ok')}
</script></body></html>

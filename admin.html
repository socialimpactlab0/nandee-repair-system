<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>南帝精密報修管理後台</title>
<style>
:root{--main:#1f4e79;--bg:#f3f5f7;--border:#d6dee7;--good:#eaf7ea;--bad:#fff0f0}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",Arial,sans-serif;background:var(--bg);color:#222}.wrap{max-width:940px;margin:0 auto;padding:24px 16px 60px}.hero{background:var(--main);color:#fff;padding:28px 22px;border-radius:16px;margin-bottom:18px;box-shadow:0 8px 20px #0002}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;line-height:1.7}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 3px 14px #0001;margin-bottom:18px}.card h2{margin:0 0 14px;font-size:22px;color:var(--main)}label{display:block;font-weight:bold;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:16px;background:#fff}textarea{min-height:96px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{color:#666;font-size:14px;line-height:1.6;margin-top:6px}.btn{width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px 18px;color:#fff;background:var(--main);font-size:18px;font-weight:bold;cursor:pointer}.btn.secondary{background:#555}.btn:disabled{opacity:.6;cursor:not-allowed}.result{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.7;background:#eef6ff}.success{background:var(--good)!important;border-left:5px solid #3c9d40}.error{background:var(--bad)!important;border-left:5px solid #d33}.repair-item{border:1px solid #d9e1ea;border-radius:12px;padding:14px;margin-top:12px;background:#fff}.repair-item.urgent{background:#ffeaea;border-left:5px solid #d33}.repair-id{font-size:18px;font-weight:bold;color:var(--main);margin-bottom:8px}.status{display:inline-block;font-weight:bold;border-radius:999px;padding:4px 10px;margin-bottom:8px;background:#eee}.waiting{background:#fff2cc}.doing{background:#d9eaf7}.done{background:#d9ead3}.hold{background:#eadcf8}.row{line-height:1.8;word-break:break-word}a{color:var(--main);font-weight:bold}.mini-btn{width:auto;margin:9px 0 0;padding:9px 14px;font-size:15px;border-radius:10px}.quick-actions{margin-top:14px;background:#f6f8fa;border:1px solid var(--border);border-radius:12px;padding:12px}.quick-title{color:var(--main);font-weight:bold}.quick-btn{width:auto;margin:8px 8px 0 0;padding:10px 14px;font-size:15px}.quick-btn.purple{background:#7052a0}.quick-btn.green{background:#3c7d40}.admin-selected{display:none;background:#fff8e1;border-left:5px solid #f6b400;padding:12px;border-radius:12px;margin-top:14px;line-height:1.7}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.stat-box{border:1px solid var(--border);background:#fff;border-radius:12px;padding:12px}.stat-num{font-size:24px;font-weight:bold;color:var(--main)}.footer-note{color:#666;font-size:14px;line-height:1.7;margin-top:20px}@media(max-width:700px){.hero h1{font-size:24px}.card{padding:18px}.grid2,.stats-grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><div class="hero"><h1>南帝精密報修管理後台</h1><p>供管理者查詢、接單、安排完成日期與更新處理進度。</p></div>
<section class="card"><h2>案件查詢與處理</h2><form id="adminForm">
<label>管理密碼</label><input type="password" name="password" id="adminPassword" required placeholder="請輸入管理密碼">
<div class="grid2"><div><label>案件狀態篩選</label><select id="adminListStatus"><option>待處理</option><option>處理中</option><option>暫緩</option><option>已完成</option><option>全部</option></select></div><div><label>查詢案件</label><button type="button" class="btn" onclick="loadAdminRepairs()">列出案件</button></div></div>
<button type="button" class="btn secondary" onclick="loadStats()">查看統計</button><div id="adminStatsResult" class="result"></div><div id="adminListResult" class="result"></div><div id="adminSelectedInfo" class="admin-selected"></div>
<label>報修編號</label><input type="text" name="caseId" id="adminCaseId" required placeholder="請從上方案件點選帶入">
<label>狀態</label><select name="status" id="adminStatus" required><option>待處理</option><option>處理中</option><option>已完成</option><option>暫緩</option></select>
<div class="quick-actions"><div class="quick-title">一鍵更新狀態</div><div class="hint">請先從上方案件清單點選一筆案件，再使用下方快速按鈕。</div><button type="button" class="btn quick-btn" onclick="quickSet('處理中')">改為處理中</button><button type="button" class="btn quick-btn purple" onclick="quickSet('暫緩')">改為暫緩</button><button type="button" class="btn quick-btn green" onclick="quickSet('已完成')">改為已完成</button></div>
<label>負責人</label><input type="text" name="owner" id="adminOwner" placeholder="例如：陳先生"><label>預定完成日</label><input type="date" name="dueDate" id="adminDueDate"><label>備註</label><textarea name="note" id="adminNote" placeholder="例如：已通知水電，預計明天下午處理。"></textarea><button id="submitAdminBtn" class="btn secondary" type="submit">更新狀態</button></form><div id="adminResult" class="result"></div></section><div class="footer-note">此頁為管理者專用，請勿將管理密碼提供給一般報修人員。</div></div>
<script>
const GAS_WEBAPP_URL='https://script.google.com/macros/s/AKfycbwZGtu0iZI4AavFB39zEygscZorsvTIdnniu2EJqHiKjo76A5WQ3G32F8M7O5M1Nfdqcw/exec';let adminRepairCache=[];
function showResult(id,html,type='success'){const b=document.getElementById(id);b.innerHTML=html;b.className='result '+type;b.style.display='block'}function formToParams(form){const fd=new FormData(form),p=new URLSearchParams();for(const[k,v]of fd.entries())p.append(k,v);return p}function jsonp(box,url,callback){const name='cb_'+Date.now()+'_'+Math.floor(Math.random()*999),script=document.createElement('script');window[name]=data=>{callback(data);delete window[name];script.remove()};script.src=url+'&callback='+name;script.onerror=()=>showResult(box,'讀取失敗，請確認 GAS 已重新部署。','error');document.body.appendChild(script)}
function loadAdminRepairs(){const password=document.getElementById('adminPassword').value.trim(),status=document.getElementById('adminListStatus').value;if(!password){showResult('adminListResult','請先輸入管理密碼。','error');return}clearSelection();showResult('adminListResult','案件讀取中…','success');jsonp('adminListResult',GAS_WEBAPP_URL+'?action=listRepairs&password='+encodeURIComponent(password)+'&status='+encodeURIComponent(status),renderAdminList)}
function photoLinks(item){let links=[];['照片連結','照片連結2','照片連結3'].forEach((key,i)=>{if(item[key])links.push(`<a href="${escapeHtml(item[key])}" target="_blank" rel="noopener">查看照片 ${i+1}</a>`)});return links.length?`<div class="row"><strong>照片：</strong>${links.join('　')}</div>`:'<div class="row"><strong>照片：</strong>-</div>'}
function renderAdminList(data){if(!data.success){showResult('adminListResult',data.message||'讀取失敗。','error');return}adminRepairCache=data.results||[];if(!adminRepairCache.length){showResult('adminListResult','目前沒有符合條件的案件。','success');return}let html=`<strong>${escapeHtml(document.getElementById('adminListStatus').value)}：${data.count} 筆</strong>`;adminRepairCache.forEach((item,i)=>{const urgent=item['緊急程度']==='急件'||item['緊急程度']==='停工／危險'?' urgent':'';html+=`<div class="repair-item${urgent}"><div class="repair-id">${escapeHtml(item['報修編號'])}</div><div class="status ${statusClass(item['狀態'])}">${escapeHtml(item['狀態']||'待處理')}</div><div class="row"><strong>建立時間：</strong>${escapeHtml(item['建立時間'])}</div><div class="row"><strong>報修人：</strong>${escapeHtml(item['姓名'])}　${escapeHtml(item['部門']||'')}</div><div class="row"><strong>地點：</strong>${escapeHtml(item['地點'])}</div><div class="row"><strong>類型／緊急：</strong>${escapeHtml(item['問題類型'])}／${escapeHtml(item['緊急程度']||'一般')}</div><div class="row"><strong>問題：</strong>${escapeHtml(item['問題說明'])}</div>${photoLinks(item)}<div class="row"><strong>負責人：</strong>${escapeHtml(item['負責人']||'-')}</div><div class="row"><strong>預定完成日：</strong>${escapeHtml(item['預定完成日']||'-')}</div><div class="row"><strong>備註：</strong>${escapeHtml(item['備註']||'-')}</div><button type="button" class="btn mini-btn" onclick="selectCase(${i})">選擇此案件</button></div>`});showResult('adminListResult',html,'success')}
function loadStats(){const password=document.getElementById('adminPassword').value.trim();if(!password){showResult('adminStatsResult','請先輸入管理密碼。','error');return}jsonp('adminStatsResult',GAS_WEBAPP_URL+'?action=stats&password='+encodeURIComponent(password),renderStats)}function renderStats(data){if(!data.success){showResult('adminStatsResult',data.message||'統計讀取失敗。','error');return}const s=data.stats||{};let html='<strong>案件統計</strong><div class="stats-grid">';['全部','待處理','處理中','暫緩','已完成','逾期','本月新增','平均完成天數'].forEach(k=>{html+=`<div class="stat-box"><div>${k}</div><div class="stat-num">${escapeHtml(s[k]??0)}</div></div>`});html+='</div>';showResult('adminStatsResult',html,'success')}
function clearSelection(){document.getElementById('adminCaseId').value='';document.getElementById('adminStatus').value='待處理';document.getElementById('adminOwner').value='';document.getElementById('adminDueDate').value='';document.getElementById('adminNote').value='';document.getElementById('adminSelectedInfo').style.display='none';document.getElementById('adminResult').style.display='none'}function selectCase(index){const item=adminRepairCache[index];if(!item)return;const oldStatus=item['狀態']||'待處理',newStatus=oldStatus==='待處理'?'處理中':oldStatus;document.getElementById('adminCaseId').value=item['報修編號']||'';document.getElementById('adminStatus').value=newStatus;document.getElementById('adminOwner').value=item['負責人']||'';document.getElementById('adminDueDate').value=toDateInput(item['預定完成日']);document.getElementById('adminNote').value=item['備註']||'';const b=document.getElementById('adminSelectedInfo');b.innerHTML=`<strong>已選擇案件：</strong>${escapeHtml(item['報修編號'])}<br><strong>地點：</strong>${escapeHtml(item['地點'])}<br><strong>問題：</strong>${escapeHtml(item['問題說明'])}<br><strong>原本狀態：</strong>${escapeHtml(oldStatus)}<br><strong>準備更新狀態：</strong>${escapeHtml(newStatus)}`;b.style.display='block';b.scrollIntoView({behavior:'smooth',block:'center'})}
function quickSet(status){if(!document.getElementById('adminCaseId').value){showResult('adminResult','請先選擇案件。','error');return}document.getElementById('adminStatus').value=status;if(status==='已完成'&&!document.getElementById('adminNote').value)document.getElementById('adminNote').value='已完成處理。';document.getElementById('adminForm').requestSubmit()}
document.getElementById('adminForm').addEventListener('submit',async function(e){e.preventDefault();if(!document.getElementById('adminCaseId').value){showResult('adminResult','請先選擇案件。','error');return}const btn=document.getElementById('submitAdminBtn'),params=formToParams(this);params.append('action','update');btn.disabled=true;btn.innerText='更新中...';showResult('adminResult','更新中，請稍候…','success');try{await fetch(GAS_WEBAPP_URL,{method:'POST',mode:'no-cors',body:params});showResult('adminResult','已送出更新，系統將重新整理案件列表。','success');setTimeout(loadAdminRepairs,900)}catch(error){showResult('adminResult','更新失敗，請稍後再試。','error')}finally{btn.disabled=false;btn.innerText='更新狀態'}});function toDateInput(value){const m=String(value||'').trim().match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);return m?`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`:''}function statusClass(s){return s==='待處理'?'waiting':s==='處理中'?'doing':s==='已完成'?'done':s==='暫緩'?'hold':''}function escapeHtml(text){return String(text??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
</script></body></html>
